{% extends 'base.html' %}
{% block title %}Eliminar Producto{% endblock %}
{% block hero_title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="alert alert-danger text-center p-4">
    <h4>¿Seguro que deseas eliminar <strong>"{{ object.nombre }}"</strong>?</h4>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'producto_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
